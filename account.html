{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
  <section class="panel">
    <h1>Change password</h1>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required>
      <label for="new">New password (at least 8 characters)</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <p><button type="submit">Change password</button></p>
    </form>
  </section>
{% endblock %}
